name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'GodYtteria/gobridgesync'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            targets: linux/amd64 linux/arm64 windows/amd64 windows/arm64 freebsd/amd64
          - runner: macos-latest
            targets: darwin/amd64 darwin/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: ./build.sh ${{ matrix.targets }}
        env:
          VERSION: ${{ github.ref_name }}
      - run: ./build.sh ${{ matrix.targets }}
        env:
          VERSION: ${{ github.ref_name }}
          EDITION: internal
          GBS_CLIENT: ${{ secrets.GBS_BUKLURAN_CLIENT }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.runner }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > checksums.txt
      - name: Sign
        env:
          GBS_SIGNING_KEY: ${{ secrets.GBS_SIGNING_KEY }}
          GBS_SIGNING_PASSWORD: ${{ secrets.GBS_SIGNING_PASSWORD }}
        run: go run ./tools/sign dist/checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "GoBridgeSync ${GITHUB_REF_NAME}" --generate-notes
