<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="15">
  <title>Inbox example: files dropped into Inbox are moved into folders by type</title>
  <rect width="880" height="400" rx="16" fill="#0f172a"/>
  <text x="40" y="48" fill="#e2e8f0" font-size="18" font-weight="600">You drop into Inbox</text>
  <text x="500" y="48" fill="#e2e8f0" font-size="18" font-weight="600">GoBridgeSync files them (about 10 s later)</text>
  <rect x="40" y="68" width="340" height="300" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="60" y="100" fill="#38bdf8" font-weight="600">Inbox/</text>
  <g fill="#cbd5e1">
    <text x="80" y="135">IMG_2041.jpg</text>
    <text x="80" y="165">trip-to-baguio.mp4</text>
    <text x="80" y="195">invoice-october.pdf</text>
    <text x="80" y="225">llama-3-8b.Q4.gguf</text>
    <text x="80" y="255">setup-1.2.exe</text>
    <text x="80" y="285">song.mp3</text>
    <text x="80" y="315">thesis-project/</text>
    <text x="80" y="345">notes.xyz</text>
  </g>
  <path d="M395 218 H470" stroke="#a3e635" stroke-width="4" fill="none"/>
  <path d="M462 206 L482 218 L462 230 Z" fill="#a3e635"/>
  <rect x="500" y="68" width="340" height="300" rx="12" fill="#1e293b" stroke="#a3e635" stroke-width="2"/>
  <g fill="#cbd5e1">
    <text x="520" y="105"><tspan fill="#a3e635">Pictures/2026-10/</tspan> IMG_2041.jpg</text>
    <text x="520" y="135"><tspan fill="#a3e635">Videos/2026-10/</tspan> trip-to-baguio.mp4</text>
    <text x="520" y="165"><tspan fill="#a3e635">Documents/</tspan> invoice-october.pdf</text>
    <text x="520" y="195"><tspan fill="#a3e635">Models/</tspan> llama-3-8b.Q4.gguf</text>
    <text x="520" y="225"><tspan fill="#a3e635">Installers/</tspan> setup-1.2.exe</text>
    <text x="520" y="255"><tspan fill="#a3e635">Music/</tspan> song.mp3</text>
    <text x="520" y="285"><tspan fill="#a3e635">Folders/</tspan> thesis-project/</text>
    <text x="520" y="315"><tspan fill="#a3e635">Other/XYZ/</tspan> notes.xyz</text>
    <text x="520" y="350" fill="#94a3b8" font-size="13">Inbox is empty again</text>
  </g>
</svg>
